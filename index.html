<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEX Route Optimizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white font-sans p-6">

  <div class="max-w-md mx-auto bg-slate-800 rounded-xl p-6 shadow-lg">

    <h1 class="text-xl font-bold mb-4 border-b border-slate-600 pb-2">
      DEX ROUTE OPTIMIZER
    </h1>

    <!-- INPUT -->
    <div class="space-y-4">
      <div>
        <label class="block text-sm text-slate-400">Amount (OPN)</label>
        <input id="amountIn" type="number" value="1"
          class="w-full p-2 rounded bg-slate-700 border border-slate-600">
      </div>

      <button onclick="runOptimizer()" id="runBtn"
        class="w-full bg-blue-600 hover:bg-blue-700 p-2 rounded">
        RUN ROUTE OPTIMIZER
      </button>
    </div>

    <!-- RESULT -->
    <div id="result" class="hidden mt-6 p-4 bg-slate-700 rounded">
      <p class="text-xs text-slate-400">Best Route Found</p>
      <p id="routePath" class="text-blue-400 font-bold"></p>

      <div class="flex justify-between mt-2">
        <span class="text-sm text-slate-400">Output</span>
        <span id="output" class="text-green-400"></span>
      </div>

      <div class="flex justify-between">
        <span class="text-sm text-slate-400">Score</span>
        <span id="score"></span>
      </div>

      <div class="flex justify-between">
        <span class="text-sm text-slate-400">Gas</span>
        <span id="gas"></span>
      </div>
    </div>

  </div>

  <script>
    async function runOptimizer() {

      const amount = document.getElementById("amountIn").value;
      const btn = document.getElementById("runBtn");

      btn.innerText = "Searching...";
      btn.disabled = true;

      try {
        const res = await fetch("/api/route", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            tokenIn: "OPN",
            tokenOut: "OPNT",
            amount: Number(amount)
          })
        });

        const data = await res.json();

        document.getElementById("result").classList.remove("hidden");

        document.getElementById("routePath").innerText =
          data.route.map(r => r.pool).join(" → ");

        document.getElementById("output").innerText =
          data.expectedOut;

        document.getElementById("score").innerText =
          data.score;

        document.getElementById("gas").innerText =
          data.gasEstimate;

      } catch (err) {
        alert("API ERROR / BELUM CONNECT");
      } finally {
        btn.innerText = "RUN ROUTE OPTIMIZER";
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>
