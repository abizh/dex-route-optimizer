<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOPN DEX Router</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans p-5">
    <div class="max-w-md mx-auto bg-slate-800 rounded-xl p-6 shadow-2xl border border-slate-700">
        <h1 class="text-xl font-bold mb-4 border-b border-slate-600 pb-2">iOPN ROUTE OPTIMIZER</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm text-slate-400">Amount OPN</label>
                <input id="amountIn" type="number" value="1.0" class="w-full bg-slate-700 border border-slate-600 rounded p-2 mt-1">
            </div>
            
            <button onclick="runOptimizer()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold transition">
                RUN ROUTE OPTIMIZER
            </button>

            <div id="result" class="hidden mt-6 p-4 bg-slate-900 rounded-lg border border-blue-500/30">
                <p class="text-xs text-slate-400">Best Route Found:</p>
                <p id="routePath" class="text-blue-400 font-mono text-sm mt-1"></p>
                <div class="flex justify-between mt-3">
                    <span class="text-sm text-slate-400">Expected Out:</span>
                    <span id="output" class="text-green-400 font-bold"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function runOptimizer() {
            const amount = document.getElementById('amountIn').value;
            const btn = event.target;
            
            btn.innerText = "Searching Route...";
            btn.disabled = true;

            try {
                const response = await fetch('/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tokenIn: 'OPN', amount: amount })
                });
                
                const data = await response.json();
                
                document.getElementById('result').classList.remove('hidden');
                document.getElementById('routePath').innerText = data.bestRoute.map(r => r.pool).join(' ➔ ');
                document.getElementById('output').innerText = data.expectedOut + " OPNT";
            } catch (err) {
                alert("Gagal koneksi ke API backend");
            } finally {
                btn.innerText = "RUN ROUTE OPTIMIZER";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
